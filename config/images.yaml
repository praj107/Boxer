# Boxer image catalog
# Only artifact and verification URLs listed here may be fetched by boxerd.
# Prefer checksum-manifest verification; static sha256 pins remain supported.
# type: cloud-image uses cloud-init for first boot
# type: iso is a traditional installer ISO (slower, queued as heavyweight job)
#
# PGP signature verification (Milestone 2):
#   verification.signature.mode        detached | clearsigned
#   verification.signature.signature_url  detached signature of the manifest (omit for clearsigned)
#   verification.signature.keyring     keyring filename under keyrings_dir (or an absolute path)
#   verification.signature.fingerprints optional list of pinned signing-key fingerprints
#   verification.signature.required    fail closed when the signature cannot be confirmed
#
# Signatures default to required: false so a fresh install verifies by checksum
# manifest out of the box. After installing the trusted keyrings into
# /etc/boxer/keyrings (see keyrings/README.md), flip required: true to fail closed.
#
# Families and refresh policy (Milestone 4):
#   family          groups templates by distro (ubuntu/debian/fedora/almalinux/rocky/arch)
#   refresh_policy  pinned | latest | manual
#     pinned  exact hash required (static sha256 or a manifest digest); never auto-refreshed
#     latest  refresh the cached blob whenever the upstream manifest digest changes (default)
#     manual  serve the cached blob until an admin runs `boxer image-refresh`
# Artifacts are cached content-addressed by verified digest, so multiple verified
# versions can coexist; `boxer prune` removes old blobs no longer in use.

images:
  ubuntu-24.04:
    type: cloud-image
    family: ubuntu
    refresh_policy: latest
    description: "Ubuntu 24.04 LTS (Noble Numbat)"
    url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
    sha256: null
    verification:
      mode: checksum-manifest
      checksum_url: "https://cloud-images.ubuntu.com/noble/current/SHA256SUMS"
      checksum_algorithm: sha256
      checksum_filename: "noble-server-cloudimg-amd64.img"
      signature:
        mode: detached
        signature_url: "https://cloud-images.ubuntu.com/noble/current/SHA256SUMS.gpg"
        keyring: "ubuntu-cloudimage-keyring.gpg"
        required: false
    default_cpu: 2
    default_ram_mb: 2048
    default_disk_gb: 20

  ubuntu-22.04:
    type: cloud-image
    family: ubuntu
    refresh_policy: latest
    description: "Ubuntu 22.04 LTS (Jammy Jellyfish)"
    url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
    sha256: null
    verification:
      mode: checksum-manifest
      checksum_url: "https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS"
      checksum_algorithm: sha256
      checksum_filename: "jammy-server-cloudimg-amd64.img"
      signature:
        mode: detached
        signature_url: "https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS.gpg"
        keyring: "ubuntu-cloudimage-keyring.gpg"
        required: false
    default_cpu: 2
    default_ram_mb: 2048
    default_disk_gb: 20

  debian-12:
    type: cloud-image
    family: debian
    refresh_policy: latest
    description: "Debian 12 (Bookworm)"
    url: "https://cdimage.debian.org/cdimage/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
    sha256: null
    verification:
      mode: checksum-manifest
      checksum_url: "https://cdimage.debian.org/cdimage/cloud/bookworm/latest/SHA512SUMS"
      checksum_algorithm: sha512
      checksum_filename: "debian-12-genericcloud-amd64.qcow2"
      signature:
        mode: detached
        signature_url: "https://cdimage.debian.org/cdimage/cloud/bookworm/latest/SHA512SUMS.sign"
        keyring: "debian-cloud-keyring.gpg"
        required: false
    default_cpu: 2
    default_ram_mb: 2048
    default_disk_gb: 20

  fedora-44:
    type: cloud-image
    family: fedora
    refresh_policy: latest
    description: "Fedora 44 Cloud Base"
    url: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
    sha256: null
    verification:
      mode: checksum-manifest
      checksum_url: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-44-1.7-x86_64-CHECKSUM"
      checksum_algorithm: sha256
      checksum_filename: "Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
      signature:
        # Fedora ships the *-CHECKSUM file as an inline PGP clearsigned message,
        # so there is no separate signature_url; checksums are read from the
        # signed payload after verification.
        mode: clearsigned
        keyring: "fedora-44-keyring.gpg"
        required: false
    default_cpu: 2
    default_ram_mb: 2048
    default_disk_gb: 20

  almalinux-9:
    type: cloud-image
    family: almalinux
    refresh_policy: latest
    description: "AlmaLinux 9 GenericCloud"
    url: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
    sha256: null
    verification:
      mode: checksum-manifest
      checksum_url: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/CHECKSUM"
      checksum_algorithm: sha256
      checksum_filename: "AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
      signature:
        # AlmaLinux ships CHECKSUM as an inline PGP clearsigned message.
        mode: clearsigned
        keyring: "almalinux-9-keyring.gpg"
        required: false
    default_cpu: 2
    default_ram_mb: 2048
    default_disk_gb: 20

  rocky-9:
    type: cloud-image
    family: rocky
    refresh_policy: latest
    description: "Rocky Linux 9 GenericCloud"
    url: "https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud.latest.x86_64.qcow2"
    sha256: null
    verification:
      # Rocky publishes a per-file CHECKSUM (SHA256 (file) = hash). Signature
      # verification keyring is admin-provided; add a verification.signature
      # block once the Rocky release keyring is installed.
      mode: checksum-manifest
      checksum_url: "https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud.latest.x86_64.qcow2.CHECKSUM"
      checksum_algorithm: sha256
      checksum_filename: "Rocky-9-GenericCloud.latest.x86_64.qcow2"
    default_cpu: 2
    default_ram_mb: 2048
    default_disk_gb: 20

  arch-latest:
    type: iso
    family: arch
    refresh_policy: latest
    description: "Arch Linux (latest ISO)"
    url: "https://geo.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso"
    sha256: null
    # Arch has no unattended cloud-installer; drive the live ISO interactively
    # over SPICE. Arch's cloud-image is preferred for headless automation.
    # Arch signs the ISO itself (archlinux-x86_64.iso.sig) rather than a checksum
    # manifest; ISO signature enforcement is tracked separately from this entry.
    install:
      method: manual
    default_cpu: 2
    default_ram_mb: 2048
    default_disk_gb: 30

  # Example unattended-install entry (admin-provided). Installer ISO URLs and
  # their SHA256SUMS/SHA256SUMS.gpg live on releases.ubuntu.com and are
  # point-release specific, so this is left commented for admins to pin:
  #
  # ubuntu-24.04-installer:
  #   type: iso
  #   family: ubuntu
  #   refresh_policy: pinned
  #   description: "Ubuntu 24.04 live-server (autoinstall)"
  #   url: "https://releases.ubuntu.com/24.04/ubuntu-24.04.X-live-server-amd64.iso"
  #   sha256: null
  #   verification:
  #     mode: checksum-manifest
  #     checksum_url: "https://releases.ubuntu.com/24.04/SHA256SUMS"
  #     checksum_algorithm: sha256
  #     checksum_filename: "ubuntu-24.04.X-live-server-amd64.iso"
  #     signature:
  #       mode: detached
  #       signature_url: "https://releases.ubuntu.com/24.04/SHA256SUMS.gpg"
  #       keyring: "ubuntu-cloudimage-keyring.gpg"
  #       required: false
  #   install:
  #     method: ubuntu     # manual | ubuntu | debian | fedora | rhel
  #   default_cpu: 2
  #   default_ram_mb: 4096
  #   default_disk_gb: 25
