# Boxer Android system-image catalog (Milestone 8)
#
# This is an ALLOWLIST of sdkmanager system-image package specs Boxer may
# install and boot. Boxer drives `sdkmanager <package>` (which performs its own
# download, checksum verification, and license acceptance) — Android blobs are
# deliberately NOT fetched through the images.yaml URL allowlist.
#
# Each entry:
#   api            Android API level
#   variant        google_apis | aosp_atd  (never google_apis_playstore for
#                  automation: it blocks `adb root` and needs a signed-in account)
#   abi            x86_64 (KVM-accelerated on x86 hosts) | arm64-v8a (slower)
#   package        the exact sdkmanager system-image package spec
#   device         avdmanager device profile (-d)
#   default_ram_mb / default_cores / default_data_gb  AVD sizing defaults

images:
  # ---- Latest stable -------------------------------------------------------
  android-36-google_apis-x86_64:
    api: 36
    variant: google_apis
    abi: x86_64
    package: "system-images;android-36;google_apis;x86_64"
    device: pixel_6
    default_ram_mb: 3072
    default_cores: 4
    default_data_gb: 6
  android-36-aosp_atd-x86_64:
    api: 36
    variant: aosp_atd
    abi: x86_64
    package: "system-images;android-36;aosp_atd;x86_64"
