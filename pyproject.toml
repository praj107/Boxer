[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxer"
version = "0.1.0"
description = "Policy-enforcing QEMU/KVM MCP control plane"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "libvirt-python>=9.0.0",
    "aiosqlite>=0.19.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "asyncssh>=2.14.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
boxerd = "boxerd.__main__:main"
boxer = "boxer_cli.__main__:cli"
boxer-mcp = "boxer_mcp.__main__:main"
boxer-notifier = "boxer_notifier.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["boxer*", "boxerd*", "boxer_mcp*", "boxer_cli*", "boxer_notifier*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
